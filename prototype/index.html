<title>Прототип сайта CCTV</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: серый вайрфрейм. Полосы-секции на всю ширину, внутри контейнер .ct. Цвет есть только у меток направлений */
:root{
  --bg:#f4f5f7; --paper:#ffffff; --fg:#1d2024; --muted:#646a72; --line:#d6dae0; --soft:#eceef2;
  --ph1:#e6e9ed; --ph2:#dde1e6; --ink:#1f2328; --ink-fg:#ffffff; --proto:#c2410c; --proto-bg:#fff1e8;
  --ok:#2e6b3d; --ok-bg:#e3f1e6; --tbd:#8a5a00;
  --c-contract:#2f63a3; --c-business:#a8721a; --c-home:#3f7f50; --c-telecom:#6a4fb3;
  --f-sans:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16181b; --paper:#1f2226; --fg:#e8eaed; --muted:#9aa1a9; --line:#363b41; --soft:#272b30;
  --ph1:#2a2e33; --ph2:#30353b; --ink:#e8eaed; --ink-fg:#16181b; --proto:#fb923c; --proto-bg:#3a2514;
  --ok:#86c495; --ok-bg:#1f3325; --tbd:#e7b25a;
  --c-contract:#6d9ee0; --c-business:#e0aa4f; --c-home:#72b583; --c-telecom:#a48ae6; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#16181b; --paper:#1f2226; --fg:#e8eaed; --muted:#9aa1a9; --line:#363b41; --soft:#272b30;
  --ph1:#2a2e33; --ph2:#30353b; --ink:#e8eaed; --ink-fg:#16181b; --proto:#fb923c; --proto-bg:#3a2514;
  --ok:#86c495; --ok-bg:#1f3325; --tbd:#e7b25a;
  --c-contract:#6d9ee0; --c-business:#e0aa4f; --c-home:#72b583; --c-telecom:#a48ae6; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-sans);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--paper)}
a{color:inherit}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:clamp(28px,4.6vw,46px);font-weight:700;letter-spacing:-.01em}
h2{font-size:clamp(22px,2.8vw,28px);font-weight:600}
h3{font-size:16px;font-weight:600}
p{margin:0}
.ct{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mut{color:var(--muted)} .sm{font-size:13px}
.lbl{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tbd{font-style:italic;color:var(--tbd);font-size:13px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
:focus-visible{outline:2px solid var(--proto);outline-offset:2px}

/* полоса прототипа */
.proto{background:var(--proto-bg);color:var(--proto);font-size:13px;border-bottom:1px solid var(--line)}
.proto .ct{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding-block:7px}
.proto b{font-family:var(--f-mono);letter-spacing:.08em}
.proto a,.proto button{color:var(--proto);font:inherit;font-weight:500;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.proto .sp{flex:1}

/* шапка */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--paper);border-bottom:1px solid var(--line)}
.hdr .ct{display:flex;align-items:center;gap:20px;min-height:64px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.logo-mark{width:30px;height:30px;border:2px dashed var(--muted);border-radius:6px;display:grid;place-items:center;font-size:9px;font-family:var(--f-mono);color:var(--muted);font-weight:500;letter-spacing:0}
.badge{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;border:1.5px solid var(--c);color:var(--c);border-radius:4px;padding:2px 7px;white-space:nowrap;font-weight:500}
.nav{display:flex;align-items:center;gap:18px;font-size:14px}
.nav>a{text-decoration:none}
.nav>a:hover,.dd summary:hover{color:var(--muted)}
.dd{position:relative}
.dd summary{list-style:none;cursor:pointer}
.dd summary::-webkit-details-marker{display:none}
.dd summary::after{content:" ▾";font-size:11px}
.dd-panel{position:absolute;top:calc(100% + 18px);left:-16px;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.12);padding:12px;z-index:55}
.dd-dirs{display:grid;grid-template-columns:repeat(2,240px);gap:8px}
.dd-dir{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:8px;border-left:4px solid var(--c);text-decoration:none;background:var(--soft)}
.dd-dir span{font-size:13px;color:var(--muted)}
.dd-svc{display:grid;grid-template-columns:repeat(3,210px);gap:18px 20px}
.dd-svc>div{display:flex;flex-direction:column;gap:2px}
.dd-svc .gh{font-weight:600;font-size:14px;text-decoration:none;margin-bottom:2px}
.dd-svc ul{list-style:none;margin:0;padding:0}
.dd-svc li a{display:block;padding:3px 0;text-decoration:none;font-size:13.5px;color:var(--muted)}
.dd-svc li a:hover,.dd-svc .gh:hover{color:var(--fg)}
.hdr .sp{flex:1}
.phone{font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:var(--ink-fg);border:1.5px solid var(--ink);border-radius:8px;padding:10px 18px;font:inherit;font-weight:500;font-size:14px;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn:hover{opacity:.88}
.burger{display:none}
.burger summary{list-style:none;cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:14px}
.burger summary::-webkit-details-marker{display:none}
.burger-panel{position:absolute;left:0;right:0;top:100%;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.12);max-height:75vh;overflow:auto}
.burger-panel .ct{display:flex;flex-direction:column;gap:4px;padding-block:12px 18px}
.burger-panel a{text-decoration:none;padding:8px 0;border-bottom:1px solid var(--soft)}
.burger-panel .lbl{margin-top:10px}
/* иконки шапки, выпадающий телефон, полноэкранное меню */
.hicon{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:var(--paper);color:var(--fg);cursor:pointer;list-style:none;padding:0}
.hicon::-webkit-details-marker{display:none}
.hicon:hover{border-color:var(--muted)}
.hicon svg{width:20px;height:20px}
.hacts{display:flex;gap:10px;align-items:center}
@media (max-width:1040px){.nav{display:none}}
details.phone-dd{position:relative}
details.phone-dd>summary{list-style:none}
details.phone-dd>summary::-webkit-details-marker{display:none}
.phone-panel{position:absolute;right:0;top:calc(100% + 10px);width:270px;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.14);padding:16px;display:flex;flex-direction:column;gap:8px;z-index:55}
.phone-panel .phone{font-size:17px;font-weight:600;user-select:all}
.mega{position:fixed;inset:0;z-index:70;background:var(--paper);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.mega-top{display:flex;align-items:center;gap:16px;min-height:64px;border-bottom:1px solid var(--line)}
.mega-top .sp{flex:1}
.mega-grid{display:grid;grid-template-columns:1.7fr 1fr 1fr;gap:36px;padding-block:32px 48px}
.mdirs{display:grid;grid-template-columns:1fr 1fr;gap:16px 24px}
.mdir{display:flex;flex-direction:column;gap:3px;border-left:4px solid var(--c);padding-left:14px}
.mdir .mh{font-weight:700;letter-spacing:.03em;font-size:15px;margin-bottom:4px}
.mega a{text-decoration:none}
.mdir a:not(.mh),.mcol a{color:var(--muted);font-size:14.5px;padding:2px 0}
.mega a:hover{color:var(--fg)}
.mcol{display:flex;flex-direction:column;gap:3px;min-width:0}
.mcol .lbl{margin-bottom:6px}
.mcol+.mcol{margin-top:22px}
.mcol .btn{align-self:flex-start;margin-top:10px}
@media (max-width:900px){.mega-grid{grid-template-columns:1fr 1fr}.mdirs{grid-column:1/-1}}
@media (max-width:560px){.mega-grid,.mdirs{grid-template-columns:1fr}}

/* секции-блоки */
.blk{position:relative;padding-block:44px;border-bottom:1px solid var(--line)}
.blk.alt{background:var(--paper)}
.blk>.ct{display:flex;flex-direction:column;gap:22px}
.labels .blk::before{content:attr(data-label);position:absolute;top:8px;left:max(16px,env(safe-area-inset-left,0px));font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--proto);background:var(--proto-bg);padding:1px 7px;border-radius:3px;z-index:2}
.sec-h{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
.sec-h>div{display:flex;flex-direction:column;gap:6px;max-width:70ch}
.lead{color:var(--muted);max-width:66ch;font-size:16px}

/* заглушка картинки */
.ph{background:repeating-linear-gradient(135deg,var(--ph1) 0 12px,var(--ph2) 12px 24px);border-radius:8px;display:grid;place-items:center;max-width:100%;width:100%;color:var(--muted);font-family:var(--f-mono);font-size:12px;text-align:center;padding:8px}

/* герой */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:32px;align-items:center}
.hero .stack{gap:16px}
.hero.dir-hero{border-left:6px solid var(--c);padding-left:24px}
@media (max-width:820px){.hero{grid-template-columns:1fr}}

.crumbs{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px}
.crumbs a{text-decoration:none}.crumbs a:hover{text-decoration:underline}

/* сетки */
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media (max-width:960px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){.g4,.g3,.g2{grid-template-columns:1fr}}
.g2>*,.g3>*,.g4>*{min-width:0}

.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:8px;text-decoration:none}
a.card:hover{border-color:var(--muted)}
.dcard{border-top:5px solid var(--c);min-height:190px}
.dcard .badge{align-self:flex-start}
.dcard .go{margin-top:auto;font-size:14px;font-weight:500}
.contract{--c:var(--c-contract)} .business{--c:var(--c-business)} .home{--c:var(--c-home)} .telecom{--c:var(--c-telecom)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:13.5px;background:var(--paper);text-decoration:none}
a.chip:hover{border-color:var(--muted)}
.chip.key{border-color:var(--fg);font-weight:600}
.chip.sm{font-size:12px;padding:2px 8px}

/* услуги: вкладки групп + раскрывающийся список */
.svc-tabs{display:flex;flex-wrap:wrap;gap:12px 28px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.svc-tab{font:inherit;font-size:17px;background:none;border:0;padding:0 0 3px;color:var(--muted);cursor:pointer;border-bottom:1.5px solid var(--line);text-align:left}
.svc-tab:hover{color:var(--fg)}
.svc-tab[aria-selected="true"]{color:var(--fg);font-weight:600;border-bottom:2px solid var(--fg)}
.svc-panel{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:stretch}
.svc-left{gap:12px}
.svc-left .btn{align-self:flex-start;margin-top:auto}
.svc-list{display:flex;flex-direction:column;min-width:0}
.svc-item{border-bottom:1px solid var(--line)}
.svc-item summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:13px 0;font-size:16px}
.svc-item summary::-webkit-details-marker{display:none}
.svc-item summary i{font-style:normal;width:26px;height:26px;flex:none;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:transform .2s}
.svc-item[open] summary i{transform:rotate(45deg)}
.svc-item summary:hover{color:var(--muted)}
.svc-body{padding:0 0 16px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.svc-body a{font-size:13.5px}
@media (max-width:820px){.svc-panel{grid-template-columns:1fr}.svc-left .btn{margin-top:4px}}

.pcard{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none}
.pcard .ph{border-radius:0}
.pc-b{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
a.pcard:hover{border-color:var(--muted)}
.pcard.empty{border-style:dashed;background:transparent}

.logos{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.logo-ph{border:1px dashed var(--line);border-radius:8px;min-height:72px;display:grid;place-items:center;font-weight:600;color:var(--muted);text-align:center;padding:8px}
@media (max-width:600px){.logos{grid-template-columns:repeat(2,1fr)}}

.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.num{background:var(--paper);padding:18px;display:flex;flex-direction:column;gap:4px}
.num b{font-size:28px;font-weight:600;line-height:1.1}
.about{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.about>*{min-width:0}
.nums.n2{grid-template-columns:1fr 1fr}
.nums.n2 .num{padding:24px}
@media (max-width:820px){.about{grid-template-columns:1fr}}
@media (max-width:760px){.nums{grid-template-columns:repeat(2,1fr)}}

.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:12px;counter-reset:s}
.steps li{counter-increment:s;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:6px}
.steps li::before{content:counter(s);font-family:var(--f-mono);font-size:12px;width:26px;height:26px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center}
.steps li span{font-size:13px;color:var(--muted)}
@media (max-width:960px){.steps{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.steps{grid-template-columns:1fr}}

details.faq{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 18px}
details.faq summary{cursor:pointer;font-weight:600}
details.faq p{margin-top:8px}

.cta-band{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;grid-template-columns:1fr 1.1fr;gap:28px;align-items:start}
@media (max-width:820px){.cta-band{grid-template-columns:1fr}}

/* формы */
form.f{display:flex;flex-direction:column;gap:12px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.fr{grid-template-columns:1fr}}
.fl{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);min-width:0}
.fl input,.fl select,.fl textarea{font:inherit;font-size:15px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.fl textarea{min-height:80px;resize:vertical}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted)}
.chk input{margin-top:3px}
.done{background:var(--ok-bg);color:var(--ok);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:6px}
.done b{font-size:16px}

/* фильтры */
.filters{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:12px;align-items:end}
@media (max-width:860px){.filters{grid-template-columns:repeat(2,1fr)}}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.facts div{background:var(--paper);padding:14px 16px;display:flex;flex-direction:column;gap:3px}
@media (max-width:600px){.facts{grid-template-columns:1fr 1fr}}

/* модальное окно, квиз, запись */
.modal{position:fixed;inset:0;z-index:80;background:rgba(10,12,14,.55);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.m-box{background:var(--paper);border-radius:14px;width:min(560px,100%);max-height:100%;overflow:auto;padding:24px;position:relative;display:flex;flex-direction:column;gap:16px}
.m-x{position:absolute;top:10px;right:12px;background:none;border:0;font-size:26px;line-height:1;cursor:pointer;color:var(--muted)}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:520px){.qopts{grid-template-columns:1fr}}
.qopt{font:inherit;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;color:var(--fg)}
.qopt.diropt{border-left:5px solid var(--c)}
.qopt[aria-pressed="true"]{border-color:var(--ink);background:var(--soft);font-weight:600}
.qbar{height:4px;background:var(--soft);border-radius:4px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--ink)}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{font:inherit;font-size:14px;background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;color:var(--fg);min-width:64px}
.slot[aria-pressed="true"]{border-color:var(--ink);background:var(--soft);font-weight:600}
.slot:disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.slot small{display:block;font-size:11px;color:var(--muted)}

.pages-list{columns:3;column-gap:24px}
.pages-list section{break-inside:avoid;margin-bottom:18px;display:flex;flex-direction:column;gap:4px}
.pages-list a{font-size:14px}
.pages-list code{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
@media (max-width:860px){.pages-list{columns:2}}
@media (max-width:520px){.pages-list{columns:1}}

/* подвал */
.ftr{background:var(--paper);padding-block:40px 28px}
.ftr .ct{display:flex;flex-direction:column;gap:28px}
.fcols{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.fcols div{display:flex;flex-direction:column;gap:6px;font-size:14px;min-width:0}
.fcols a{text-decoration:none;color:var(--muted)}
.fcols a:hover{color:var(--fg)}
.fbot{border-top:1px solid var(--line);padding-top:16px;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 20px}
@media (max-width:760px){.fcols{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>

<div class="proto"><div class="ct">
  <b>ПРОТОТИП</b><span>cctv.plus · кликабельная схема без дизайна</span><span class="sp"></span>
  <a href="#pages">Все страницы</a>
  <button type="button" id="lbl-toggle">Скрыть подписи блоков</button>
</div></div>
<header class="hdr" id="hdr"></header>
<main id="app"></main>
<footer class="ftr" id="ftr"></footer>
<nav class="mega" id="mega" aria-label="Карта сайта" hidden></nav>
<div class="modal" id="modal" hidden><div class="m-box" role="dialog" aria-modal="true" aria-labelledby="m-title"><button type="button" class="m-x" id="m-x" aria-label="Закрыть">×</button><div id="m-body" class="stack"></div></div></div>

<script>

let bk = {type:'Замер', day:null, time:null};
function bookingWidget(){
  const days=[]; const base=new Date(); base.setHours(0,0,0,0);
  for(let i=1;days.length<10;i++){const dt=new Date(base);dt.setDate(base.getDate()+i);if(dt.getDay()!==0)days.push(dt)}
  const fmt = dt => dt.toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
  const wd = dt => dt.toLocaleDateString('ru-RU',{weekday:'short'});
  const times=['10:00','12:00','14:00','16:00','18:00'];
  const busy=(di,ti)=>((di*3+ti*7)%5)===0;
  const di = bk.day===null?-1:bk.day;
  return `<div class="stack" id="bk">
    <div class="stack" style="gap:6px"><span class="lbl">1. Что нужно</span><div class="slots">${['Замер','Консультация','Выезд инженера'].map(t=>`<button type="button" class="slot" data-bk-type="${t}" aria-pressed="${bk.type===t}">${t}</button>`).join('')}</div></div>
    <div class="stack" style="gap:6px"><span class="lbl">2. День</span><div class="slots">${days.map((dt,i)=>`<button type="button" class="slot" data-bk-day="${i}" aria-pressed="${di===i}">${fmt(dt)}<small>${wd(dt)}</small></button>`).join('')}</div></div>
    <div class="stack" style="gap:6px"><span class="lbl">3. Время</span>${di<0?'<p class="sm mut">Сначала выберите день</p>':`<div class="slots">${times.map((t,ti)=>`<button type="button" class="slot" data-bk-time="${t}" aria-pressed="${bk.time===t}" ${busy(di,ti)?'disabled':''}>${t}</button>`).join('')}</div>`}</div>
    ${di>=0&&bk.time?`<div class="stack" style="gap:6px"><span class="lbl">4. Контакты</span><p class="sm">${bk.type}: ${fmt(days[di])}, ${bk.time}</p>${formHTML('callback')}</div>`:''}
  </div>`;
}

let svcTab='pir';
function svcItem(slug,open){
  const s=S[slug], n=PROJECTS.filter(p=>p.works.includes(slug)).length;
  return `<details class="svc-item" id="svc-${slug}"${open?' open':''}><summary><span>${s.name}</span><i aria-hidden="true">+</i></summary><div class="svc-body"><p>${s.desc}</p>${tbd('состав работ уточнить у заказчика')}<div class="chips">${s.dirs.map(d=>`<a class="badge ${d}" href="#${d}" style="text-decoration:none">${DIRS[d].brand}</a>`).join('')}</div>${n?`<a href="#projects" data-flt-work="${slug}">Проекты с этой работой: ${n} →</a>`:'<span class="sm mut">Проектов с этой работой пока нет</span>'}</div></details>`;
}
let svcOnly=null, svcDir=null;
function svcBlock(open){
  const groups=SGROUPS.map(g=>({...g,items:svcOnly?g.items.filter(x=>svcOnly.includes(x)):g.items})).filter(g=>g.items.length);
  if(open) svcTab=grpOf(open).k;
  if(!groups.some(g=>g.k===svcTab)) svcTab=groups[0].k;
  const g=groups.find(x=>x.k===svcTab);
  const cta=svcDir?'':'<button class="btn" type="button" data-form="general">Обсудить проект</button>';
  return `<div class="svc-tabs" role="tablist" aria-label="Группы услуг">${groups.map(x=>`<button type="button" class="svc-tab" role="tab" aria-selected="${x.k===svcTab}" data-svc-tab="${x.k}">${x.name}</button>`).join('')}</div>
  <div class="svc-panel"><div class="stack svc-left"><span class="lbl">${g.tag}</span><h2>${g.name}</h2><p class="mut">${g.desc}</p>${cta}</div>
  <div class="svc-list">${g.items.map(s=>svcItem(s,s===open)).join('')}</div></div>`;
}
const svcWrap=()=>`<div id="svc-wrap" class="stack" style="gap:28px">${svcBlock()}</div>`;
const svcList=list=>`<div class="svc-list" style="max-width:760px">${list.map(s=>svcItem(s)).join('')}</div>`;

function allRoutes(){
  return [
    ['Общее',[['main','Главная'],['services','Услуги (раздел на главной)'],['projects','Проекты'],['about','О группе'],['documents','Документы'],['clients','Клиенты и отзывы'],['partners','Партнёрам'],['careers','Карьера'],['contacts','Контакты'],['privacy','Политика ПДн']]],
    ...DKEYS.map(d=>[DIRS[d].brand,[[d,'Страница направления'],...DIRS[d].subs.map(s=>[`${d}-${s[0]}`,s[1]]),[`${d}-projects`,'Кейсы'],...(d==='home'?[['home-booking','Онлайн-запись']]:[])]]),
    ['Услуги на главной (вкладки)',SGROUPS.map(g=>['services-'+g.k,g.name])],
    ['Кейсы',PROJECTS.map(p=>['project-'+p.slug,p.name])],
  ];
}
function pgPages(){
  const groups=allRoutes(); const n=groups.reduce((a,g)=>a+g[1].length,0);
  return blk('Карта прототипа',`<div class="stack"><h1>Все страницы</h1><p class="lead">${n} страниц прототипа. Квизы и формы открываются кнопками на страницах направлений.</p></div><div class="pages-list">${groups.map(g=>`<section><span class="lbl">${g[0]}</span>${g[1].map(r=>`<a href="#${r[0]}">${r[1]}</a>`).join('')}</section>`).join('')}</div><div class="row"><button class="btn ghost" type="button" data-quiz="business">Квиз Business</button><button class="btn ghost" type="button" data-quiz="home">Квиз Home</button><button class="btn ghost" type="button" data-form="tender">Форма КП</button><button class="btn ghost" type="button" data-form="callback">Обратный звонок</button></div>`);
}
const pg404 = () => blk('Нет страницы',`<div class="stack"><h1>Страница не найдена</h1><a class="btn" href="#main">На главную</a></div>`);

/* ---------- Роутер ---------- */
let openSvc=null, scrollId=null;
function route(){
  const h=(location.hash||'#main').slice(1)||'main';
  let html, dir=null;
  const m=h.match(/^([a-z]+)-(.+)$/);
  if(h==='main'){svcTab='pir';html=pgMain()}
  else if(h==='dirs'){html=pgMain()}
  else if(DIRS[h]){dir=h;html=pgDir(h)}
  else if(m&&DIRS[m[1]]&&m[2]==='projects'){dir=m[1];html=pgDirProjects(m[1])}
  else if(h==='home-booking'){dir='home';html=pgBooking()}
  else if(m&&DIRS[m[1]]&&DIRS[m[1]].subs.some(s=>s[0]===m[2])){dir=m[1];html=pgSub(m[1],m[2])}
  else if(h==='services'){html=pgMain();scrollId='svc-sec'}
  else if(h.startsWith('services-')&&SGROUPS.some(g=>g.k===h.slice(9))){svcTab=h.slice(9);html=pgMain();scrollId='svc-sec'}
  else if(h.startsWith('service-')&&S[h.slice(8)]){html=pgMain(h.slice(8));openSvc=h.slice(8)}
  else if(h==='projects') html=pgProjects();
  else if(h.startsWith('project-')&&P[h.slice(8)]) html=pgProject(h.slice(8));
  else html=({about:pgAbout,documents:pgDocuments,clients:pgClients,partners:pgPartners,careers:pgCareers,contacts:pgContacts,privacy:pgPrivacy,pages:pgPages}[h]||pg404)();
  if(!dir) setSvcScope(null);
  ctxDir=dir; renderHeader();
  app.innerHTML=html;
  if(h==='dirs'){document.getElementById('dirs').scrollIntoView()}
  else if(scrollId){document.getElementById(scrollId).scrollIntoView();scrollId=null}
  else if(openSvc){const el=document.getElementById('svc-'+openSvc);if(el)el.scrollIntoView({block:'center'});openSvc=null}
  else window.scrollTo(0,0);
}

/* ---------- Модальное окно, квиз ---------- */
const modal=document.getElementById('modal'), mBody=document.getElementById('m-body');
function openModal(html){mBody.innerHTML=html;modal.hidden=false;const f=mBody.querySelector('input,button,select');if(f)f.focus()}
function closeModal(){modal.hidden=true;mBody.innerHTML=''}
document.getElementById('m-x').onclick=closeModal;
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!modal.hidden)closeModal();else if(!mega.hidden){closeMega();document.getElementById('menu-btn')?.focus()}});

const QUIZ={
  contract:{title:'Заявка · CCTV CONTRACT',final:'tender',qs:[
    ['Какой у вас объект?',['Жилой комплекс или МКД','Социальный объект','Промышленный объект','Другое'],0],
    ['Что нужно?',['Рассчитать КП','Пригласить в тендер','Консультация инженера'],0],
    ['Какие работы нужны?',SGROUPS.map(g=>g.name),1]]},
  business:{title:'Расчёт сметы · CCTV BUSINESS',final:'callback',qs:[
    ['Какой у вас объект?',['Торговый центр','Коммерческое помещение','Склад','АЗС','Другое'],0],
    ['Какие работы нужны?',['Отделка','Фасад','Кровля','Инженерные системы','Слаботочные сети','Проект и смета'],1],
    ['Площадь объекта',['До 100 м²','100–500 м²','500–2000 м²','Больше 2000 м²'],0],
    ['Когда начать?',['Как можно скорее','В течение месяца','Через 2–3 месяца','Пока считаю бюджет'],0]]},
  home:{title:'Расчёт ремонта · CCTV HOME',final:'callback',qs:[
    ['Что ремонтируем?',['Квартира','Загородный дом'],0],
    ['Какое состояние?',['Новостройка без отделки','Вторичное жильё','Дом в коробке','Другое'],0],
    ['Что нужно?',['Дизайн-проект','Черновая отделка','Чистовая отделка','Инженерные системы','Фасад или кровля'],1],
    ['Площадь',['До 50 м²','50–100 м²','100–200 м²','Больше 200 м²'],0]]},
  telecom:{title:'Заявка · CCTV TELECOM',final:'tender',qs:[
    ['Что нужно?',['Рассчитать КП','Пригласить в тендер','Консультация'],0],
    ['Кого вы представляете?',['Ростелеком','МГТС','МТС','Другой оператор связи'],0]]},
};
let qz=null;
const leadOpt=(d,attr)=>`<button type="button" class="qopt diropt ${d}" ${attr}="${d}"><b>${DIRS[d].brand}</b><br><span class="sm mut">${DIRS[d].card}</span></button>`;
const qhead=(title,cur,total)=>`<span class="lbl" id="m-title">${title} · шаг ${cur}${total?' из '+total:''}</span><div class="qbar"><i style="width:${total?Math.round((cur-1)/total*100):Math.min(90,cur*12)}%"></i></div>`;
const backBtn='<button class="btn ghost sm" type="button" data-q-back>← Назад</button>';
function startLead(d){qz={k:d?(d==='home'?'homechoice':d):'lead',step:0,a:{},lead:true,dir:d||null};modal.hidden=false;quizRender()}
function quizRender(){
  if(qz.k==='lead'){
    mBody.innerHTML=`${qhead('Оставить заявку',1)}<h3>Какое направление вам нужно?</h3><p class="sm mut">Дальше зададим пару вопросов именно под вашу задачу.</p><div class="qopts">${DKEYS.map(d=>leadOpt(d,'data-lead-dir')).join('')}</div>`;
    return;
  }
  if(qz.k==='homechoice'){
    mBody.innerHTML=`${qhead('Заявка · CCTV HOME',2)}<h3>С чего начнём?</h3><div class="qopts"><button type="button" class="qopt" data-home-choice="booking"><b>Записаться на замер</b><br><span class="sm mut">Выберите день и время</span></button><button type="button" class="qopt" data-home-choice="calc"><b>Рассчитать ремонт</b><br><span class="sm mut">4 вопроса и контакты</span></button></div><div class="row">${backBtn}</div>`;
    return;
  }
  if(qz.k==='booking'){
    mBody.innerHTML=`${qhead('Запись на замер · CCTV HOME',3,3)}<h3>Когда вам удобно?</h3>${bookingWidget()}<div class="row">${backBtn}</div>`;
    return;
  }
  const Q=QUIZ[qz.k], off=qz.lead?(qz.k==='home'?2:1):0, total=off+Q.qs.length+1, step=qz.step;
  const back=(step>0||qz.lead)?backBtn:'';
  if(step>=Q.qs.length){
    const sum=Q.qs.map((q,i)=>`<li><span class="mut">${q[0]}</span> ${[].concat(qz.a[i]||[]).join(', ')||'—'}</li>`).join('');
    mBody.innerHTML=`${qhead(Q.title,total,total)}<h3>${Q.final==='tender'?'Куда прислать КП?':'Куда прислать расчёт?'}</h3><ul class="sm" style="margin:0;padding-left:18px">${sum}</ul>${formHTML(Q.final,qz.k)}<div class="row">${back}</div>`;
    return;
  }
  const q=Q.qs[step], multi=q[2], cur=[].concat(qz.a[step]||[]);
  mBody.innerHTML=`${qhead(Q.title,off+step+1,total)}<h3>${q[0]}</h3>${multi?'<p class="sm mut">Можно выбрать несколько</p>':''}<div class="qopts">${q[1].map(o=>`<button type="button" class="qopt" data-q-opt="${o}" aria-pressed="${cur.includes(o)}">${o}</button>`).join('')}</div><div class="row">${back}${multi?`<button class="btn sm" type="button" data-q-next ${cur.length?'':'disabled'}>Далее →</button>`:''}</div>`;
}

/* ---------- События ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,a,summary'); if(!t) return;
  document.querySelectorAll('details.dd[open],details.burger[open],details.phone-dd[open]').forEach(d=>{if(!d.contains(t))d.open=false});
  if(t.id==='menu-btn'){openMega();return}
  if(t.id==='mega-x'){closeMega();document.getElementById('menu-btn')?.focus();return}
  if(t.closest('#mega')){if(t.matches('a'))setTimeout(closeMega,0);else if(t.dataset.lead!==undefined)closeMega()}
  if(t.dataset.form&&t.closest('.phone-dd')) t.closest('.phone-dd').open=false;
  if(t.matches('a')&&t.closest('details.dd,details.burger')) t.closest('details').open=false;
  if(t.dataset.form){openModal(formHTML(t.dataset.form,t.dataset.dir).replace('<h3 id=','<h3 id="m-title" data-id='))}
  if(t.dataset.quiz){qz={k:t.dataset.quiz,step:0,a:{}};modal.hidden=false;quizRender()}
  if(t.dataset.qOpt!==undefined&&qz){
    const q=QUIZ[qz.k].qs[qz.step];
    if(q[2]){const cur=[].concat(qz.a[qz.step]||[]);const i=cur.indexOf(t.dataset.qOpt);i<0?cur.push(t.dataset.qOpt):cur.splice(i,1);qz.a[qz.step]=cur;quizRender()}
    else{qz.a[qz.step]=t.dataset.qOpt;qz.step++;quizRender()}
  }
  if(t.dataset.qNext!==undefined&&qz){qz.step++;quizRender()}
  if(t.dataset.qBack!==undefined&&qz){
    if(qz.k==='booking') qz.k='homechoice';
    else if(qz.k==='homechoice'){qz.k='lead';qz.dir=null}
    else if(qz.step>0) qz.step--;
    else if(qz.lead){if(qz.k==='home')qz.k='homechoice';else{qz.k='lead';qz.dir=null}}
    quizRender();
  }
  if(t.dataset.lead!==undefined) startLead(t.dataset.lead);
  if(t.dataset.leadDir) startLead(t.dataset.leadDir);
  if(t.dataset.homeChoice&&qz){if(t.dataset.homeChoice==='booking'){bk={type:'Замер',day:null,time:null};qz.k='booking'}else{qz.k='home';qz.step=0;qz.a={}}quizRender()}
  if(t.dataset.bkType){bk.type=t.dataset.bkType;document.getElementById('bk').outerHTML=bookingWidget()}
  if(t.dataset.bkDay){bk.day=+t.dataset.bkDay;bk.time=null;document.getElementById('bk').outerHTML=bookingWidget()}
  if(t.dataset.bkTime){bk.time=t.dataset.bkTime;document.getElementById('bk').outerHTML=bookingWidget()}
  if(t.dataset.svcTab){svcTab=t.dataset.svcTab;document.getElementById('svc-wrap').innerHTML=svcBlock()}
  if(t.dataset.fltWork){flt={dir:'',work:t.dataset.fltWork,type:''}}
  if(t.id==='flt-reset'){flt={dir:'',work:'',type:''};app.innerHTML=pgProjects()}
  if(t.id==='lbl-toggle'){const on=document.body.classList.toggle('labels');t.textContent=on?'Скрыть подписи блоков':'Показать подписи блоков';try{localStorage.setItem('cctv-labels',on?'1':'0')}catch(_){}}
});
document.addEventListener('change',e=>{
  const s=e.target.closest('[data-flt]'); if(!s) return;
  flt[s.dataset.flt]=s.value; document.getElementById('pgrid').innerHTML=projGrid();
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('.js-form'); if(!f) return;
  e.preventDefault();
  let extra=''; if(qz&&!modal.hidden) extra=' вместе с ответами квиза'+(QUIZ[qz.k]||qz.dir?`, с меткой ${DIRS[qz.dir||qz.k].brand}`:'');
  if(f.closest('#bk')) extra=` с записью: ${bk.type.toLowerCase()}`;
  f.outerHTML=doneHTML(f.dataset.type,extra);
  if(f.closest&&qz) qz=null;
});
window.addEventListener('hashchange',()=>{closeModal();closeMega();route()});

let labelsOn=true; try{labelsOn=localStorage.getItem('cctv-labels')!=='0'}catch(_){}
document.body.classList.toggle('labels',labelsOn);
document.getElementById('lbl-toggle').textContent=labelsOn?'Скрыть подписи блоков':'Показать подписи блоков';
renderFooter(); route();
</script>
